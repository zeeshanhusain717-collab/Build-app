name: Build Bluetooth Call App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bluetooth/call
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BluetoothCall"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.bluetooth.call"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bluetooth.call"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan BT Call</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/bluetooth/call/MainActivity.kt <<'EOF'
          package com.bluetooth.call

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothServerSocket
          import android.bluetooth.BluetoothSocket
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              companion object {
                  private val APP_UUID: UUID = UUID.fromString("b81d7350-e22f-413e-862d-88b0f8553255")
                  private const val SERVICE_NAME = "ZeeshanBTCallService"
                  private const val REQ_CODE = 200
              }

              private var btAdapter: BluetoothAdapter? = null
              private val foundDevices = ArrayList<BluetoothDevice>()
              private val deviceNames = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>

              private var acceptThread: AcceptThread? = null
              private var connectThread: ConnectThread? = null
              private var audioThread: AudioStreamThread? = null
              private var isCallRunning = false

              private lateinit var statusTv: TextView
              private lateinit var scanBtn: Button
              private lateinit var disconnectBtn: Button
              private lateinit var listView: ListView

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val device = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              }
                              device?.let { dev ->
                                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                      val name = dev.name ?: "Unknown Device"
                                      // सिर्फ वही डिवाइस दिखाएं जिनका नाम या सिग्नल सही हो (या जिन्होंने हमारा ऐप खोल रखा हो)
                                      if (!foundDevices.contains(dev) && !name.contains("Unknown")) {
                                          foundDevices.add(dev)
                                          deviceNames.add("📱 $name\n${dev.address}")
                                          listAdapter.notifyDataSetChanged()
                                      }
                                  }
                              }
                          }
                          BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                              scanBtn.text = "🔍 Scan Nearby App Users"
                              scanBtn.isEnabled = true
                              Toast.makeText(this@MainActivity, "Scan finished!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  btAdapter = BluetoothAdapter.getDefaultAdapter()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(35, 45, 35, 45)
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  val title = TextView(this).apply {
                      text = "🎙️ Zeeshan Bluetooth Walkie-Talkie"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 25)
                  }

                  statusTv = TextView(this).apply {
                      text = "Status: Ready & Waiting"
                      textSize = 15f
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  scanBtn = Button(this).apply {
                      text = "🔍 Scan Nearby App Users"
                      setBackgroundColor(Color.parseColor("#10B981"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { startDeviceScan() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                  }

                  disconnectBtn = Button(this).apply {
                      text = "🛑 End Call / Disconnect"
                      setBackgroundColor(Color.parseColor("#EF4444"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      visibility = View.GONE
                      setOnClickListener { terminateCall() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                  }

                  listView = ListView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 20f
                      }
                  }

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceNames)
                  listView.adapter = listAdapter

                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < foundDevices.size) {
                          val selectedDevice = foundDevices[pos]
                          connectToPeer(selectedDevice)
                      }
                  }

                  root.addView(title)
                  root.addView(statusTv)
                  root.addView(scanBtn)
                  root.addView(disconnectBtn)
                  root.addView(listView)
                  setContentView(root)

                  checkPermissionsAndInit()
              }

              private fun checkPermissionsAndInit() {
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      perms.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), REQ_CODE)

                  // ऐप खुलते ही ब्लूटूथ ऑटो-इनेबल करें
                  if (btAdapter != null && !btAdapter!!.isEnabled) {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          btAdapter!!.enable()
                      }
                  }

                  // सर्वर लिसनर चालू रखें ताकि दूसरा यूज़र कॉल करे तो तुरंत घंटी बजे
                  startIncomingListener()

                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_FOUND)
                      addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                  }
                  registerReceiver(receiver, filter)
              }

              private fun startDeviceScan() {
                  if (btAdapter == null) return
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Bluetooth Scan permission needed!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  foundDevices.clear()
                  deviceNames.clear()
                  listAdapter.notifyDataSetChanged()

                  // पहले से पेयर्ड डिवाइस डालें
                  btAdapter?.bondedDevices?.let { paired ->
                      for (d in paired) {
                          foundDevices.add(d)
                          deviceNames.add("⭐ Paired: ${d.name}\n${d.address}")
                      }
                      listAdapter.notifyDataSetChanged()
                  }

                  if (btAdapter!!.isDiscovering) {
                      btAdapter!!.cancelDiscovery()
                  }
                  btAdapter!!.startDiscovery()
                  scanBtn.text = "Scanning..."
                  scanBtn.isEnabled = false
                  Toast.makeText(this, "Searching nearby app users...", Toast.LENGTH_SHORT).show()
              }

              private fun startIncomingListener() {
                  acceptThread?.cancel()
                  acceptThread = AcceptThread()
                  acceptThread?.start()
              }

              private inner class AcceptThread : Thread() {
                  private var serverSocket: BluetoothServerSocket? = null

                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              serverSocket = btAdapter?.listenUsingRfcommWithServiceRecord(SERVICE_NAME, APP_UUID)
                          }
                      } catch (e: IOException) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      var socket: BluetoothSocket?
                      while (true) {
                          try {
                              socket = serverSocket?.accept()
                          } catch (e: IOException) {
                              break
                          }
                          if (socket != null) {
                              val remoteName = socket.remoteDevice?.name ?: "User"
                              runOnUiThread {
                                  showIncomingCallPopup(socket, remoteName)
                              }
                              break
                          }
                      }
                  }

                  fun cancel() {
                      try { serverSocket?.close() } catch (e: Exception) {}
                  }
              }

              private fun showIncomingCallPopup(socket: BluetoothSocket, callerName: String) {
                  AlertDialog.Builder(this)
                      .setTitle("📞 Incoming Bluetooth Call!")
                      .setMessage("$callerName is calling you via Bluetooth.")
                      .setCancelable(false)
                      .setPositiveButton("Accept Call") { _, _ ->
                          statusTv.text = "Status: Connected with $callerName"
                          statusTv.setTextColor(Color.parseColor("#10B981"))
                          scanBtn.visibility = View.GONE
                          disconnectBtn.visibility = View.VISIBLE
                          listView.visibility = View.GONE
                          initAudioStream(socket)
                      }
                      .setNegativeButton("Reject") { _, _ ->
                          try { socket.close() } catch (e: Exception) {}
                          startIncomingListener()
                      }
                      .show()
              }

              private fun connectToPeer(device: BluetoothDevice) {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return
                  btAdapter?.cancelDiscovery()
                  connectThread?.cancel()
                  connectThread = ConnectThread(device)
                  connectThread?.start()
                  statusTv.text = "Connecting to ${device.name}..."
                  statusTv.setTextColor(Color.parseColor("#F59E0B"))
              }

              private inner class ConnectThread(private val device: BluetoothDevice) : Thread() {
                  private var socket: BluetoothSocket? = null

                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              socket = device.createRfcommSocketToServiceRecord(APP_UUID)
                          }
                      } catch (e: IOException) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      try {
                          socket?.connect()
                          runOnUiThread {
                              statusTv.text = "Status: Connected with ${device.name}"
                              statusTv.setTextColor(Color.parseColor("#10B981"))
                              scanBtn.visibility = View.GONE
                              disconnectBtn.visibility = View.VISIBLE
                              listView.visibility = View.GONE
                          }
                          initAudioStream(socket!!)
                      } catch (e: IOException) {
                          e.printStackTrace()
                          try { socket?.close() } catch (e2: Exception) {}
                          runOnUiThread {
                              statusTv.text = "Status: Connection Failed. Try again."
                              statusTv.setTextColor(Color.parseColor("#EF4444"))
                          }
                          startIncomingListener()
                      }
                  }

                  fun cancel() {
                      try { socket?.close() } catch (e: Exception) {}
                  }
              }

              private fun initAudioStream(socket: BluetoothSocket) {
                  isCallRunning = true
                  audioThread = AudioStreamThread(socket)
                  audioThread?.start()
              }

              private inner class AudioStreamThread(private val socket: BluetoothSocket) : Thread() {
                  private var input: InputStream? = null
                  private var output: OutputStream? = null

                  init {
                      try {
                          input = socket.inputStream
                          output = socket.outputStream
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      val rate = 8000
                      val channelIn = AudioFormat.CHANNEL_IN_MONO
                      val channelOut = AudioFormat.CHANNEL_OUT_MONO
                      val format = AudioFormat.ENCODING_PCM_16BIT
                      val bufSize = AudioRecord.getMinBufferSize(rate, channelIn, format)

                      if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return

                      val recorder = AudioRecord(MediaRecorder.AudioSource.MIC, rate, channelIn, format, bufSize)
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(format).setSampleRate(rate).setChannelMask(channelOut).build())
                          .setBufferSizeInBytes(bufSize)
                          .build()

                      recorder.startRecording()
                      track.play()

                      val sendBuffer = ByteArray(bufSize)
                      val recvBuffer = ByteArray(bufSize)

                      // Incoming Audio Stream Reader
                      Thread {
                          try {
                              while (isCallRunning) {
                                  val readBytes = input?.read(recvBuffer) ?: -1
                                  if (readBytes > 0) {
                                      track.write(recvBuffer, 0, readBytes)
                                  }
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }.start()

                      // Outgoing Audio Stream Writer
                      try {
                          while (isCallRunning) {
                              val size = recorder.read(sendBuffer, 0, sendBuffer.size)
                              if (size > 0) {
                                  output?.write(sendBuffer, 0, size)
                                  output?.flush()
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          try {
                              recorder.stop()
                              recorder.release()
                              track.stop()
                              track.release()
                              socket.close()
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun terminateCall() {
                  isCallRunning = false
                  try {
                      acceptThread?.cancel()
                      connectThread?.cancel()
                  } catch (e: Exception) {}

                  statusTv.text = "Status: Call Ended"
                  statusTv.setTextColor(Color.parseColor("#EF4444"))
                  disconnectBtn.visibility = View.GONE
                  scanBtn.visibility = View.VISIBLE
                  listView.visibility = View.VISIBLE
                  Toast.makeText(this, "Call Disconnected", Toast.LENGTH_SHORT).show()
                  startIncomingListener()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  terminateCall()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bluetooth-Call-App-v2
          path: app/build/outputs/apk/debug/app-debug.apk

