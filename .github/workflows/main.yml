name: Build Pro Bluetooth Call APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # गिटहब के रोबोट के लिए सटीक SDK और Build-Tools सेटअप
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          platforms: android-34
          build-tools: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create Structure & Gradle Files
        run: |
          mkdir -p app/src/main/java/com/bt/procall
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BTProCall"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.bt.procall"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bt.procall"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <application
                  android:allowBackup="true"
                  android:label="BT Pro Call"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">BT Pro Call</string>
          </resources>
          EOF

      - name: Generate MainActivity
        run: |
          cat > app/src/main/java/com/bt/procall/MainActivity.kt <<'EOF'
          package com.bt.procall

          import android.Manifest
          import android.bluetooth.*
          import android.content.pm.PackageManager
          import android.media.*
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private val MY_UUID: UUID = UUID.fromString("fa87c0d0-afac-11de-8a39-0800200c9a66")
              private var bluetoothAdapter: BluetoothAdapter? = null
              private var bluetoothSocket: BluetoothSocket? = null
              private var outputStream: OutputStream? = null
              private var inputStream: InputStream? = null

              private var audioRecord: AudioRecord? = null
              private var audioTrack: AudioTrack? = null
              private var isCallActive = false
              private var isMuted = false

              private lateinit var statusText: TextView
              private lateinit var deviceListView: ListView
              private val deviceList = ArrayList<String>()
              private val deviceAddressMap = HashMap<String, String>()
              private lateinit var adapter: ArrayAdapter<String>

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestPermissions()
                  initBluetooth()
                  showHomeUI()
              }

              private fun requestPermissions() {
                  val perms = arrayOf(
                      Manifest.permission.BLUETOOTH_SCAN,
                      Manifest.permission.BLUETOOTH_CONNECT,
                      Manifest.permission.BLUETOOTH_ADMIN,
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  ActivityCompat.requestPermissions(this, perms, 301)
              }

              private fun initBluetooth() {
                  val manager = getSystemService(BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = manager.adapter
              }

              private fun showHomeUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF070F1E.toInt())
                      setPadding(32, 48, 32, 48)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "🛡️ BT Pro Intercom"
                      textSize = 24f
                      setTextColor(0xFFFFD700.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  root.addView(title)

                  statusText = TextView(this).apply {
                      text = "Status: Ready\nSelect paired device or start server."
                      textSize = 14f
                      setTextColor(0xFF94A3B8.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 20)
                  }
                  root.addView(statusText)

                  val btnServer = Button(this).apply {
                      text = "🟢 Start Server (Wait for Call)"
                      setBackgroundColor(0xFF10B981.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { startServer() }
                  }
                  root.addView(btnServer)

                  val btnScan = Button(this).apply {
                      text = "🔵 Load Paired Devices"
                      setBackgroundColor(0xFF3B82F6.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { loadPairedDevices() }
                  }
                  root.addView(btnScan)

                  deviceListView = ListView(this).apply {
                      setBackgroundColor(0xFF0B132B.toInt())
                  }
                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceList)
                  deviceListView.adapter = adapter

                  deviceListView.setOnItemClickListener { _, _, position, _ ->
                      val name = deviceList[position]
                      val address = deviceAddressMap[name]
                      if (address != null) {
                          connectToDevice(address, name)
                      }
                  }

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0, 1f
                  ).apply { topMargin = 20 }
                  root.addView(deviceListView, params)

                  setContentView(root)
              }

              private fun loadPairedDevices() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return
                  deviceList.clear()
                  deviceAddressMap.clear()
                  val paired = bluetoothAdapter?.bondedDevices
                  if (paired != null && paired.isNotEmpty()) {
                      for (device in paired) {
                          val name = device.name ?: "Unknown"
                          val addr = device.address
                          deviceList.add(name)
                          deviceAddressMap[name] = addr
                      }
                      adapter.notifyDataSetChanged()
                      statusText.text = "Select a device to connect:"
                  } else {
                      statusText.text = "No paired devices found. Pair via phone settings first."
                  }
              }

              private fun startServer() {
                  statusText.text = "Status: Waiting for incoming connection..."
                  Thread {
                      try {
                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return@Thread
                          val serverSocket = bluetoothAdapter?.listenUsingRfcommWithServiceRecord("BTProCall", MY_UUID)
                          val socket = serverSocket?.accept()
                          serverSocket?.close()
                          if (socket != null) {
                              bluetoothSocket = socket
                              outputStream = socket.outputStream
                              inputStream = socket.inputStream
                              runOnUiThread { showActiveCallUI("Connected Peer") }
                              startAudioEngine()
                          }
                      } catch (e: Exception) {
                          runOnUiThread { statusText.text = "Server Error: ${e.message}" }
                      }
                  }.start()
              }

              private fun connectToDevice(address: String, name: String) {
                  statusText.text = "Connecting to $name..."
                  Thread {
                      try {
                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return@Thread
                          val device = bluetoothAdapter?.getRemoteDevice(address)
                          val socket = device?.createRfcommSocketToServiceRecord(MY_UUID)
                          socket?.connect()
                          if (socket != null) {
                              bluetoothSocket = socket
                              outputStream = socket.outputStream
                              inputStream = socket.inputStream
                              runOnUiThread { showActiveCallUI(name) }
                              startAudioEngine()
                          }
                      } catch (e: Exception) {
                          runOnUiThread { statusText.text = "Connection Failed: ${e.message}" }
                      }
                  }.start()
              }

              private fun showActiveCallUI(peerName: String) {
                  val callLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF070F1E.toInt())
                      setPadding(40, 80, 40, 80)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val nameView = TextView(this).apply {
                      text = "📞 In Call With:\n$peerName"
                      textSize = 22f
                      setTextColor(0xFFFFD700.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 60)
                  }
                  callLayout.addView(nameView)

                  val btnMute = Button(this).apply {
                      text = "🎤 Mute: OFF"
                      setBackgroundColor(0xFF334155.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          isMuted = !isMuted
                          text = if (isMuted) "🎤 Mute: ON" else "🎤 Mute: OFF"
                      }
                  }
                  callLayout.addView(btnMute)

                  val btnEnd = Button(this).apply {
                      text = "🔴 End Call"
                      setBackgroundColor(0xFFEF4444.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { endCall() }
                  }
                  val endParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = 30 }
                  callLayout.addView(btnEnd, endParams)

                  setContentView(callLayout)
                  isCallActive = true
              }

              private fun startAudioEngine() {
                  val rate = 8000
                  val channelIn = AudioFormat.CHANNEL_IN_MONO
                  val channelOut = AudioFormat.CHANNEL_OUT_MONO
                  val format = AudioFormat.ENCODING_PCM_16BIT
                  val bufferSize = AudioRecord.getMinBufferSize(rate, channelIn, format)

                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return

                  audioRecord = AudioRecord(MediaRecorder.AudioSource.MIC, rate, channelIn, format, bufferSize)
                  audioTrack = AudioTrack.Builder()
                      .setAudioFormat(AudioFormat.Builder().setEncoding(format).setSampleRate(rate).setChannelMask(channelOut).build())
                      .setBufferSizeInBytes(bufferSize)
                      .build()

                  audioRecord?.startRecording()
                  audioTrack?.play()

                  Thread {
                      val buf = ByteArray(bufferSize)
                      while (isCallActive) {
                          val read = audioRecord?.read(buf, 0, buf.size) ?: 0
                          if (read > 0 && !isMuted) {
                              try {
                                  outputStream?.write(buf, 0, read)
                              } catch (e: Exception) { break }
                          }
                      }
                  }.start()

                  Thread {
                      val buf = ByteArray(bufferSize)
                      while (isCallActive) {
                          try {
                              val read = inputStream?.read(buf) ?: -1
                              if (read > 0) {
                                  audioTrack?.write(buf, 0, read)
                              }
                          } catch (e: Exception) { break }
                      }
                  }.start()
              }

              private fun endCall() {
                  isCallActive = false
                  try {
                      audioRecord?.stop()
                      audioRecord?.release()
                      audioTrack?.stop()
                      audioTrack?.release()
                      bluetoothSocket?.close()
                  } catch (e: Exception) {}
                  showHomeUI()
              }
          }
          EOF

      # Gradle Wrapper खुद बनाकर सही तरीके से बिल्ड करना
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Pro-Call-APK
          path: app/build/outputs/apk/debug/app-debug.apk
