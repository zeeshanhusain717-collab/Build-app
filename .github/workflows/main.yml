name: Build Bluetooth Call App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bluetooth/call
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BluetoothCall"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.bluetooth.call"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bluetooth.call"
                  minSdk 26
                  targetSdk 34
                  versionCode 13
                  versionName "13.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources, Icon & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bluetooth Call</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM15.5,17.5c-2.33,0 -4.51,-0.91 -6.14,-2.54 -1.63,-1.63 -2.54,-3.81 -2.54,-6.14V8c0,-0.55 0.45,-1 1,-1h2.5c0.55,0 1,0.45 1,1v2c0,0.55 -0.45,1 -1,1h-1c0.39,1.17 1.33,2.11 2.5,2.5v-1c0,-0.55 0.45,-1 1,-1h2c0.55,0 1,0.45 1,1v2.5c0,0.55 -0.45,1 -1,1h-0.5z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt with Fully Fixed Compiler Errors
        run: |
          cat > app/src/main/java/com/bluetooth/call/MainActivity.kt <<'EOF'
          package com.bluetooth.call

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothServerSocket
          import android.bluetooth.BluetoothSocket
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.media.audiofx.AcousticEchoCanceler
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.io.InputStream
          import java.io.OutputStream
          import java.io.RandomAccessFile
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              companion object {
                  private val APP_UUID: UUID = UUID.fromString("b81d7350-e22f-413e-862d-88b0f8553255")
                  private const val SERVICE_NAME = "ZeeshanBTCallService"
                  private const val REQ_CODE = 200
              }

              private var btAdapter: BluetoothAdapter? = null
              private val foundDevices = ArrayList<BluetoothDevice>()
              private val deviceNames = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>

              private var acceptThread: AcceptThread? = null
              private var connectThread: ConnectThread? = null
              private var audioThread: AudioStreamThread? = null
              
              @Volatile private var isCallActive = false
              @Volatile private var isMuted = false
              @Volatile private var isRecording = false
              private var isSpeakerOn = false
              private var activeSocket: BluetoothSocket? = null
              private lateinit var audioManager: AudioManager

              private lateinit var homeLayout: LinearLayout
              private lateinit var callLayout: LinearLayout
              private lateinit var statusTv: TextView
              private lateinit var scanBtn: Button
              private lateinit var listView: ListView
              
              private lateinit var callTitleTv: TextView
              private lateinit var timerTv: TextView
              private lateinit var muteBtn: Button
              private lateinit var speakerBtn: Button
              private lateinit var recordBtn: Button
              private lateinit var endCallBtn: Button

              private val handler = Handler(Looper.getMainLooper())
              private var scanRunnable: Runnable? = null
              
              private var secondsElapsed = 0
              private val timerHandler = Handler(Looper.getMainLooper())
              private lateinit var timerRunnable: Runnable

              private var recordingFile: File? = null
              private var recordingOutputStream: FileOutputStream? = null
              private var totalAudioLen: Long = 0

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val device = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              }
                              device?.let { dev ->
                                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                      val name = dev.name ?: "Unknown"
                                      if (!foundDevices.contains(dev) && !name.contains("Unknown")) {
                                          foundDevices.add(dev)
                                          val isVerified = name.contains("Zeeshan", ignoreCase = true) || name.contains("Call", ignoreCase = true) || name.contains("Galaxy", ignoreCase = true) || name.contains("Redmi", ignoreCase = true) || name.contains("Vivo", ignoreCase = true) || name.contains("OPPO", ignoreCase = true)
                                          
                                          if (isVerified) {
                                              deviceNames.add("🟢 Verified App User: $name\n${dev.address}")
                                          } else {
                                              deviceNames.add("📱 Bluetooth Device: $name\n${dev.address}")
                                          }
                                          listAdapter.notifyDataSetChanged()
                                      }
                                  }
                              }
                          }
                          BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                              resetScanButton()
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  btAdapter = BluetoothAdapter.getDefaultAdapter()
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  val mainRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(30, 40, 30, 40)
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  homeLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                  }

                  val title = TextView(this).apply {
                      text = "🎙️ Zeeshan Bluetooth Call"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  statusTv = TextView(this).apply {
                      text = "Status: Ready & Waiting"
                      textSize = 15f
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  scanBtn = Button(this).apply {
                      text = "🔍 Scan Nearby App Users (5 Sec)"
                      setBackgroundColor(Color.parseColor("#10B981"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { startDeviceScan() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 20) }
                  }

                  listView = ListView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 24f
                      }
                  }

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceNames)
                  listView.adapter = listAdapter

                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < foundDevices.size) {
                          val selectedDevice = foundDevices[pos]
                          connectToPeer(selectedDevice)
                      }
                  }

                  homeLayout.addView(title)
                  homeLayout.addView(statusTv)
                  homeLayout.addView(scanBtn)
                  homeLayout.addView(listView)

                  callLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(-1, -1)
                      setPadding(10, 10, 10, 10)
                  }

                  val callHeader = TextView(this).apply {
                      text = "📞 LIVE BLUETOOTH CALL"
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#34D399"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  callTitleTv = TextView(this).apply {
                      text = "Connected with Peer"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 10)
                  }

                  timerTv = TextView(this).apply {
                      text = "00:00"
                      textSize = 34f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 30)
                  }

                  val controlsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 30) }
                  }

                  muteBtn = Button(this).apply {
                      text = "🎤 Mute"
                      textSize = 13f
                      setBackgroundColor(Color.parseColor("#475569"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { toggleMute() }
                      layoutParams = LinearLayout.LayoutParams(220, 130).apply { setMargins(0, 0, 10, 0) }
                  }

                  speakerBtn = Button(this).apply {
                      text = "🔊 Speaker"
                      textSize = 13f
                      setBackgroundColor(Color.parseColor("#475569"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { toggleSpeaker() }
                      layoutParams = LinearLayout.LayoutParams(220, 130).apply { setMargins(10, 0, 10, 0) }
                  }

                  recordBtn = Button(this).apply {
                      text = "🔴 Record"
                      textSize = 13f
                      setBackgroundColor(Color.parseColor("#475569"))
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { toggleRecording() }
                      layoutParams = LinearLayout.LayoutParams(220, 130).apply { setMargins(10, 0, 0, 0) }
                  }

                  controlsLayout.addView(muteBtn)
                  controlsLayout.addView(speakerBtn)
                  controlsLayout.addView(recordBtn)

                  endCallBtn = Button(this).apply {
                      text = "🛑 End Call"
                      setBackgroundColor(Color.parseColor("#EF4444"))
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setOnClickListener { terminateCall() }
                      layoutParams = LinearLayout.LayoutParams(600, 150)
                  }

                  callLayout.addView(callHeader)
                  callLayout.addView(callTitleTv)
                  callLayout.addView(timerTv)
                  callLayout.addView(controlsLayout)
                  callLayout.addView(endCallBtn)

                  mainRoot.addView(homeLayout)
                  mainRoot.addView(callLayout)
                  setContentView(mainRoot)

                  checkPermissionsAndInit()
                  setupPhoneStateListener()
              }

              private fun checkPermissionsAndInit() {
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.READ_PHONE_STATE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      perms.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), REQ_CODE)

                  if (btAdapter != null && !btAdapter!!.isEnabled) {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          btAdapter!!.enable()
                      }
                  }

                  startIncomingListener()

                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_FOUND)
                      addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                  }
                  registerReceiver(receiver, filter)
              }

              private fun setupPhoneStateListener() {
                  try {
                      val telephonyManager = getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      @Suppress("DEPRECATION")
                      telephonyManager.listen(object : PhoneStateListener() {
                          override fun onCallStateChanged(state: Int, phoneNumber: String?) {
                              super.onCallStateChanged(state, phoneNumber)
                              if (state == TelephonyManager.CALL_STATE_OFFHOOK) {
                                  if (isCallActive) {
                                      terminateCall()
                                      if (btAdapter != null && btAdapter!!.isEnabled) {
                                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                              btAdapter!!.disable()
                                          }
                                      }
                                      Toast.makeText(this@MainActivity, "Phone call answered: Bluetooth call killed", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }, PhoneStateListener.LISTEN_CALL_STATE)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun startCallUI(peerName: String) {
                  isCallActive = true
                  homeLayout.visibility = View.GONE
                  callLayout.visibility = View.VISIBLE
                  callTitleTv.text = "Connected: $peerName"
                  
                  secondsElapsed = 0
                  timerRunnable = object : Runnable {
                      override fun run() {
                          val hours = secondsElapsed / 3600
                          val mins = (secondsElapsed % 3600) / 60
                          val secs = secondsElapsed % 60
                          timerTv.text = if (hours > 0) {
                              String.format("%02d:%02d:%02d", hours, mins, secs)
                          } else {
                              String.format("%02d:%02d", mins, secs)
                          }
                          secondsElapsed++
                          timerHandler.postDelayed(this, 1000)
                      }
                  }
                  timerHandler.post(timerRunnable)
              }

              private fun endCallUI() {
                  if (isRecording) {
                      stopRecording()
                  }
                  isCallActive = false
                  timerHandler.removeCallbacks(timerRunnable)
                  callLayout.visibility = View.GONE
                  homeLayout.visibility = View.VISIBLE
                  statusTv.text = "Status: Call Ended"
                  statusTv.setTextColor(Color.parseColor("#EF4444"))
                  isMuted = false
                  muteBtn.text = "🎤 Mute"
                  muteBtn.setBackgroundColor(Color.parseColor("#475569"))
                  recordBtn.text = "🔴 Record"
                  recordBtn.setBackgroundColor(Color.parseColor("#475569"))
              }

              private fun toggleMute() {
                  isMuted = !isMuted
                  if (isMuted) {
                      muteBtn.text = "🔇 Muted"
                      muteBtn.setBackgroundColor(Color.parseColor("#EF4444"))
                      Toast.makeText(this, "Microphone Muted", Toast.LENGTH_SHORT).show()
                  } else {
                      muteBtn.text = "🎤 Mute"
                      muteBtn.setBackgroundColor(Color.parseColor("#475569"))
                      Toast.makeText(this, "Microphone Unmuted", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleSpeaker() {
                  isSpeakerOn = !isSpeakerOn
                  audioManager.isSpeakerphoneOn = isSpeakerOn
                  if (isSpeakerOn) {
                      speakerBtn.text = "🔊 Speaker On"
                      speakerBtn.setBackgroundColor(Color.parseColor("#10B981"))
                      Toast.makeText(this, "Speaker Enabled", Toast.LENGTH_SHORT).show()
                  } else {
                      speakerBtn.text = "🔈 Earpiece"
                      speakerBtn.setBackgroundColor(Color.parseColor("#475569"))
                      Toast.makeText(this, "Earpiece Enabled", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun toggleRecording() {
                  if (!isRecording) {
                      startRecording()
                  } else {
                      stopRecording()
                  }
              }

              private fun startRecording() {
                  try {
                      val musicDir = getExternalFilesDir(Environment.DIRECTORY_MUSIC)
                      if (musicDir != null && !musicDir.exists()) {
                          musicDir.mkdirs()
                      }
                      recordingFile = File(musicDir, "BTCall_${System.currentTimeMillis()}.wav")
                      recordingOutputStream = FileOutputStream(recordingFile)
                      
                      writeWavHeader(recordingOutputStream!!, 0, 0, 8000, 1.toShort(), 16.toShort())
                      totalAudioLen = 0

                      isRecording = true
                      recordBtn.text = "⏹️ Recording"
                      recordBtn.setBackgroundColor(Color.parseColor("#EF4444"))
                      Toast.makeText(this, "Call recording started", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      e.printStackTrace()
                      Toast.makeText(this, "Failed to start recording", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun stopRecording() {
                  try {
                      isRecording = false
                      recordingOutputStream?.close()
                      recordingOutputStream = null

                      if (recordingFile != null && recordingFile!!.exists()) {
                          val totalDataLen = totalAudioLen + 36
                          RandomAccessFile(recordingFile, "rw").use { raf ->
                              raf.seek(0)
                              writeWavHeaderRandomAccess(raf, totalAudioLen, totalDataLen, 8000, 1.toShort(), 16.toShort())
                          }
                          Toast.makeText(this, "Saved in Music: ${recordingFile!!.name}", Toast.LENGTH_LONG).show()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      recordBtn.text = "🔴 Record"
                      recordBtn.setBackgroundColor(Color.parseColor("#475569"))
                  }
              }

              private fun writeWavHeader(out: OutputStream, totalAudioLen: Long, totalDataLen: Long, longSampleRate: Long, channels: Short, bitsPerSample: Short) {
                  val byteRate = longSampleRate * channels * bitsPerSample / 8
                  val header = ByteArray(44)
                  header[0] = ('R'.code.toByte()); header[1] = ('I'.code.toByte()); header[2] = ('F'.code.toByte()); header[3] = ('F'.code.toByte())
                  
                  // सुरक्षित टाइपकास्टिंग का उपयोग किया गया है ताकि बिल्ड फेल न हो
                  val dataLenInt = totalDataLen.toInt()
                  header[4] = (dataLenInt and 0xff).toByte()
                  header[5] = ((dataLenInt shr 8) and 0xff).toByte()
                  header[6] = ((dataLenInt shr 16) and 0xff).toByte()
                  header[7] = ((dataLenInt shr 24) and 0xff).toByte()
                  
                  header[8] = ('W'.code.toByte()); header[9] = ('A'.code.toByte()); header[10] = ('V'.code.toByte()); header[11] = ('E'.code.toByte())
                  header[12] = ('f'.code.toByte()); header[13] = ('m'.code.toByte()); header[14] = ('t'.code.toByte()); header[15] = (' '.code.toByte())
                  header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0
                  header[20] = 1; header[21] = 0
                  header[22] = channels.toByte(); header[23] = 0
                  
                  val srInt = longSampleRate.toInt()
                  header[24] = (srInt and 0xff).toByte()
                  header[25] = ((srInt shr 8) and 0xff).toByte()
                  header[26] = ((srInt shr 16) and 0xff).toByte()
                  header[27] = ((srInt shr 24) and 0xff).toByte()
                  
                  val brInt = byteRate.toInt()
                  header[28] = (brInt and 0xff).toByte()
                  header[29] = ((brInt shr 8) and 0xff).toByte()
                  header[30] = ((brInt shr 16) and 0xff).toByte()
                  header[31] = ((brInt shr 24) and 0xff).toByte()
                  
                  header[32] = (channels * bitsPerSample / 8).toByte(); header[33] = 0
                  header[34] = bitsPerSample.toByte(); header[35] = 0
                  header[36] = ('d'.code.toByte()); header[37] = ('a'.code.toByte()); header[38] = ('t'.code.toByte()); header[39] = ('a'.code.toByte())
                  
                  val audioLenInt = totalAudioLen.toInt()
                  header[40] = (audioLenInt and 0xff).toByte()
                  header[41] = ((audioLenInt shr 8) and 0xff).toByte()
                  header[42] = ((audioLenInt shr 16) and 0xff).toByte()
                  header[43] = ((audioLenInt shr 24) and 0xff).toByte()
                  out.write(header, 0, 44)
              }

              private fun writeWavHeaderRandomAccess(raf: RandomAccessFile, totalAudioLen: Long, totalDataLen: Long, longSampleRate: Long, channels: Short, bitsPerSample: Short) {
                  val byteRate = longSampleRate * channels * bitsPerSample / 8
                  raf.seek(0)
                  raf.writeBytes("RIFF")
                  raf.write(intToByteArray(totalDataLen.toInt()))
                  raf.writeBytes("WAVEfmt ")
                  raf.write(intToByteArray(16))
                  raf.write(shortToByteArray(1))
                  raf.write(shortToByteArray(channels))
                  raf.write(intToByteArray(longSampleRate.toInt()))
                  raf.write(intToByteArray(byteRate.toInt()))
                  raf.write(shortToByteArray((channels * bitsPerSample / 8).toShort()))
                  raf.write(shortToByteArray(bitsPerSample))
                  raf.writeBytes("data")
                  raf.write(intToByteArray(totalAudioLen.toInt()))
              }

              private fun intToByteArray(i: Int): ByteArray {
                  return byteArrayOf((i and 0xff).toByte(), ((i shr 8) and 0xff).toByte(), ((i shr 16) and 0xff).toByte(), ((i shr 24) and 0xff).toByte())
              }

              private fun shortToByteArray(s: Short): ByteArray {
                  return byteArrayOf((s.toInt() and 0xff).toByte(), ((s.toInt() shr 8) and 0xff).toByte())
              }

              private fun startDeviceScan() {
                  if (btAdapter == null) return
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Bluetooth Scan permission needed!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  foundDevices.clear()
                  deviceNames.clear()
                  listAdapter.notifyDataSetChanged()

                  btAdapter?.bondedDevices?.let { paired ->
                      for (d in paired) {
                          foundDevices.add(d)
                          deviceNames.add("⭐ Paired App User: ${d.name}\n${d.address}")
                      }
                      listAdapter.notifyDataSetChanged()
                  }

                  if (btAdapter!!.isDiscovering) {
                      btAdapter!!.cancelDiscovery()
                  }
                  btAdapter!!.startDiscovery()
                  scanBtn.text = "Scanning (5s)..."
                  scanBtn.isEnabled = false
                  Toast.makeText(this, "Scanning for 5 seconds...", Toast.LENGTH_SHORT).show()

                  scanRunnable = Runnable {
                      if (btAdapter != null && ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED) {
                          if (btAdapter!!.isDiscovering) {
                              btAdapter!!.cancelDiscovery()
                          }
                      }
                      resetScanButton()
                  }
                  handler.postDelayed(scanRunnable!!, 5000)
              }

              private fun resetScanButton() {
                  scanBtn.text = "🔍 Scan Nearby App Users (5 Sec)"
                  scanBtn.isEnabled = true
              }

              private fun startIncomingListener() {
                  acceptThread?.cancel()
                  acceptThread = AcceptThread()
                  acceptThread?.start()
              }

              private inner class AcceptThread : Thread() {
                  private var serverSocket: BluetoothServerSocket? = null

                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              serverSocket = btAdapter?.listenUsingInsecureRfcommWithServiceRecord(SERVICE_NAME, APP_UUID)
                          }
                      } catch (e: IOException) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      var socket: BluetoothSocket?
                      while (true) {
                          try {
                              socket = serverSocket?.accept()
                          } catch (e: IOException) {
                              break
                          }
                          if (socket != null) {
                              val remoteName = socket.remoteDevice?.name ?: "User"
                              
                              if (isCallActive) {
                                  runOnUiThread {
                                      showCallWaitingPopup(socket, remoteName)
                                  }
                              } else {
                                  runOnUiThread {
                                      showIncomingCallPopup(socket, remoteName)
                                  }
                              }
                          }
                      }
                  }

                  fun cancel() {
                      try { serverSocket?.close() } catch (e: Exception) {}
                  }
              }

              private fun showIncomingCallPopup(socket: BluetoothSocket, callerName: String) {
                  AlertDialog.Builder(this)
                      .setTitle("📞 Incoming Bluetooth Call!")
                      .setMessage("$callerName is calling you via Bluetooth.")
                      .setCancelable(false)
                      .setPositiveButton("Accept") { _, _ ->
                          activeSocket?.close()
                          activeSocket = socket
                          startCallUI(callerName)
                          initAudioStream(socket)
                      }
                      .setNegativeButton("Reject") { _, _ ->
                          try { socket.close() } catch (e: Exception) {}
                      }
                      .show()
              }

              private fun showCallWaitingPopup(newSocket: BluetoothSocket, callerName: String) {
                  AlertDialog.Builder(this)
                      .setTitle("⏳ Call Waiting (Another Call)")
                      .setMessage("$callerName is calling while you are on a call. Switch to this call?")
                      .setCancelable(false)
                      .setPositiveButton("Accept & Switch") { _, _ ->
                          isCallActive = false
                          timerHandler.removeCallbacks(timerRunnable)
                          try { activeSocket?.close() } catch (e: Exception) {}
                          
                          activeSocket = newSocket
                          startCallUI(callerName)
                          initAudioStream(newSocket)
                      }
                      .setNegativeButton("Ignore") { _, _ ->
                          try { newSocket.close() } catch (e: Exception) {}
                      }
                      .show()
              }

              private fun connectToPeer(device: BluetoothDevice) {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return
                  
                  scanRunnable?.let { handler.removeCallbacks(it) }
                  if (btAdapter!!.isDiscovering) btAdapter!!.cancelDiscovery()
                  resetScanButton()

                  connectThread?.cancel()
                  connectThread = ConnectThread(device)
                  connectThread?.start()
                  statusTv.text = "Connecting to ${device.name}..."
                  statusTv.setTextColor(Color.parseColor("#F59E0B"))
              }

              private inner class ConnectThread(private val device: BluetoothDevice) : Thread() {
                  private var socket: BluetoothSocket? = null

                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              socket = device.createInsecureRfcommSocketToServiceRecord(APP_UUID)
                          }
                      } catch (e: IOException) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      try {
                          if (btAdapter != null && ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_SCAN) == PackageManager.PERMISSION_GRANTED) {
                              if (btAdapter!!.isDiscovering) {
                                  btAdapter!!.cancelDiscovery()
                              }
                          }

                          socket?.connect()
                          
                          activeSocket?.close()
                          activeSocket = socket
                          
                          val peerName = device.name ?: "Peer"
                          runOnUiThread {
                              startCallUI(peerName)
                          }
                          initAudioStream(socket!!)
                      } catch (e: IOException) {
                          e.printStackTrace()
                          try { socket?.close() } catch (e2: Exception) {}
                          runOnUiThread {
                              statusTv.text = "Status: Connection Failed. Try again."
                              statusTv.setTextColor(Color.parseColor("#EF4444"))
                          }
                      }
                  }

                  fun cancel() {
                      try { socket?.close() } catch (e: Exception) {}
                  }
              }

              private fun initAudioStream(socket: BluetoothSocket) {
                  audioThread = AudioStreamThread(socket)
                  audioThread?.start()
              }

              private inner class AudioStreamThread(private val socket: BluetoothSocket) : Thread() {
                  private var input: InputStream? = null
                  private var output: OutputStream? = null

                  init {
                      try {
                          input = socket.inputStream
                          output = socket.outputStream
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  override fun run() {
                      val rate = 8000
                      val channelIn = AudioFormat.CHANNEL_IN_MONO
                      val channelOut = AudioFormat.CHANNEL_OUT_MONO
                      val format = AudioFormat.ENCODING_PCM_16BIT
                      val bufSize = AudioRecord.getMinBufferSize(rate, channelIn, format)

                      if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return

                      val recorder = AudioRecord(MediaRecorder.AudioSource.MIC, rate, channelIn, format, bufSize)
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(format).setSampleRate(rate).setChannelMask(channelOut).build())
                          .setBufferSizeInBytes(bufSize)
                          .build()

                      if (AcousticEchoCanceler.isAvailable()) {
                          val echoCanceler = AcousticEchoCanceler.create(recorder.audioSessionId)
                          echoCanceler?.enabled = true
                      }

                      recorder.startRecording()
                      track.play()

                      val sendBuffer = ByteArray(bufSize)
                      val recvBuffer = ByteArray(bufSize)

                      Thread {
                          try {
                              while (isCallActive) {
                                  val readBytes = input?.read(recvBuffer) ?: -1
                                  if (readBytes > 0) {
                                      track.write(recvBuffer, 0, readBytes)
                                  }
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }.start()

                      try {
                          while (isCallActive) {
                              val size = recorder.read(sendBuffer, 0, sendBuffer.size)
                              if (size > 0) {
                                  var dataToWrite = sendBuffer
                                  if (isMuted) {
                                      dataToWrite = ByteArray(size)
                                  }

                                  if (isRecording && recordingOutputStream != null) {
                                      try {
                                          recordingOutputStream?.write(dataToWrite, 0, size)
                                          totalAudioLen += size
                                      } catch (e: Exception) {
                                          e.printStackTrace()
                                      }
                                  }

                                  output?.write(dataToWrite, 0, size)
                                  output?.flush()
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          try {
                              recorder.stop()
                              recorder.release()
                              track.stop()
                              track.release()
                              socket.close()
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun terminateCall() {
                  endCallUI()
                  try {
                      activeSocket?.close()
                      acceptThread?.cancel()
                      connectThread?.cancel()
                  } catch (e: Exception) {}

                  Toast.makeText(this, "Call Disconnected", Toast.LENGTH_SHORT).show()
                  startIncomingListener()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  scanRunnable?.let { handler.removeCallbacks(it) }
                  terminateCall()
              }
          }
