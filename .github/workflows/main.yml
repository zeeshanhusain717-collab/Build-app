name: Build Bluetooth Call App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/bluetooth/call
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BluetoothCall"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.bluetooth.call"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bluetooth.call"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "3.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources, Icon & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bluetooth Call</string>
          </resources>
          EOF

          # 3D Bluetooth Vector Logo
          cat > app/src/main/res/drawable/ic_bluetooth.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="120dp"
              android:height="120dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13.5,8l3.25,3.25L13.5,14.5V8zM10.5,16V8l-3.25,3.25L10.5,16z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M17.71,7.71L12,2h-1v7.59L6.41,5.03 5,6.44 10.56,12 5,17.56 6.41,18.97 11,14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM12,4.83l2.88,2.88L12,10.59V4.83zM12,19.17v-5.76l2.88,2.88L12,19.17z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_bluetooth"
                  android:roundIcon="@drawable/ic_bluetooth"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt with 3D UI & In-Call Controls
        run: |
          cat > app/src/main/java/com/bluetooth/call/MainActivity.kt <<'EOF'
          package com.bluetooth.call

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothServerSocket
          import android.bluetooth.BluetoothSocket
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.io.IOException
          import java.io.InputStream
          import java.io.OutputStream
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              companion object {
                  private val APP_UUID: UUID = UUID.fromString("b81d7350-e22f-413e-862d-88b0f8553255")
                  private const val SERVICE_NAME = "ZeeshanBTCallService"
                  private const val REQ_CODE = 200
              }

              private var btAdapter: BluetoothAdapter? = null
              private val foundDevices = ArrayList<BluetoothDevice>()
              private val deviceNames = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>

              private var acceptThread: AcceptThread? = null
              private var connectThread: ConnectThread? = null
              private var audioThread: AudioStreamThread? = null
              private var isCallRunning = false
              private var isMuted = false
              private var isRecordingAudio = false

              // UI Layouts
              private lateinit var mainDashboardLayout: LinearLayout
              private lateinit var inCallScreenLayout: LinearLayout
              private lateinit var statusTv: TextView
              private lateinit var scanBtn: Button
              private lateinit var listView: ListView

              // In-Call UI Elements
              private lateinit var connectedUserTv: TextView
              private lateinit var callTimerTv: TextView
              private lateinit var muteBtn: Button
              private lateinit var recordBtn: Button
              private lateinit var endCallBtn: Button

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val device = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              }
                              device?.let { dev ->
                                  if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                      val name = dev.name ?: "Unknown"
                                      if (!foundDevices.contains(dev) && !name.contains("Unknown")) {
                                          foundDevices.add(dev)
                                          deviceNames.add("📱 $name\n${dev.address}")
                                          listAdapter.notifyDataSetChanged()
                                      }
                                  }
                              }
                          }
                          BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                              scanBtn.text = "🔍 Scan Nearby App Users"
                              scanBtn.isEnabled = true
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  btAdapter = BluetoothAdapter.getDefaultAdapter()

                  // Root Container (White Background)
                  val rootLayout = FrameLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      setBackgroundColor(Color.parseColor("#F8FAFC"))
                  }

                  // 1. DASHBOARD LAYOUT
                  mainDashboardLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  // 3D Blue Header Bar
                  val headerBar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(30, 45, 30, 45)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(Color.parseColor("#1E40AF"), Color.parseColor("#1D4ED8"))
                      ).apply {
                          cornerRadii = floatArrayOf(0f, 0f, 0f, 0f, 30f, 30f, 30f, 30f)
                      }
                      elevation = 12f
                  }

                  val headerTitle = TextView(this).apply {
                      text = "BLUETOOTH CALL"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  statusTv = TextView(this).apply {
                      text = "Status: Ready & Waiting"
                      textSize = 14f
                      setTextColor(Color.parseColor("#93C5FD"))
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 0)
                  }

                  headerBar.addView(headerTitle)
                  headerBar.addView(statusTv)

                  // Content Area under Header
                  val contentArea = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }

                  scanBtn = Button(this).apply {
                      text = "🔍 Scan Nearby App Users"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#10B981")) // Green 3D Button
                          cornerRadius = 25f
                      }
                      elevation = 6f
                      setOnClickListener { startDeviceScan() }
                      layoutParams = LinearLayout.LayoutParams(-1, 130).apply { setMargins(0, 0, 0, 20) }
                  }

                  listView = ListView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE) // White Background Box
                          cornerRadius = 25f
                          setStroke(2, Color.parseColor("#E2E8F0"))
                      }
                  }

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceNames)
                  listView.adapter = listAdapter

                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < foundDevices.size) {
                          connectToPeer(foundDevices[pos])
                      }
                  }

                  contentArea.addView(scanBtn)
                  contentArea.addView(listView)

                  mainDashboardLayout.addView(headerBar)
                  mainDashboardLayout.addView(contentArea)


                  // 2. IN-CALL SCREEN LAYOUT (Hidden by default)
                  inCallScreenLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setBackgroundColor(Color.parseColor("#0F172A")) // Dark Immersive In-Call BG
                      setPadding(40, 80, 40, 60)
                      visibility = View.GONE
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  val inCallIcon = TextView(this).apply {
                      text = "📞"
                      textSize = 50f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  val inCallLabel = TextView(this).apply {
                      text = "Connected Call"
                      textSize = 16f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                  }

                  connectedUserTv = TextView(this).apply {
                      text = "User Name"
                      textSize = 26f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 10)
                  }

                  callTimerTv = TextView(this).apply {
                      text = "00:00"
                      textSize = 15f
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 50)
                  }

                  inCallScreenLayout.addView(inCallIcon)
                  inCallScreenLayout.addView(inCallLabel)
                  inCallScreenLayout.addView(connectedUserTv)
                  inCallScreenLayout.addView(callTimerTv)

                  // In-Call Action Buttons Row (Mute, Record, End)
                  val actionRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 40, 0, 0) }
                  }

                  muteBtn = Button(this).apply {
                      text = "🎤 Mute"
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#334155"))
                      }
                      layoutParams = LinearLayout.LayoutParams(160, 160).apply { setMargins(15, 0, 15, 0) }
                      setOnClickListener { toggleMute() }
                  }

                  recordBtn = Button(this).apply {
                      text = "⏺️ Record"
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#334155"))
                      }
                      layoutParams = LinearLayout.LayoutParams(160, 160).apply { setMargins(15, 0, 15, 0) }
                      setOnClickListener { toggleAudioRecording() }
                  }

                  actionRow.addView(muteBtn)
                  actionRow.addView(recordBtn)
                  inCallScreenLayout.addView(actionRow)

                  // Red End Call Button at Bottom
                  endCallBtn = Button(this).apply {
                      text = "🔴 End Call"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#EF4444"))
                          cornerRadius = 40f
                      }
                      elevation = 8f
                      setOnClickListener { terminateCall() }
                      layoutParams = LinearLayout.LayoutParams(500, 130).apply { setMargins(0, 80, 0, 0) }
                  }
                  inCallScreenLayout.addView(endCallBtn)

                  rootLayout.addView(mainDashboardLayout)
                  rootLayout.addView(inCallScreenLayout)
                  setContentView(rootLayout)

                  checkPermissionsAndInit()
              }

              private fun checkPermissionsAndInit() {
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                      perms.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), REQ_CODE)

                  if (btAdapter != null && !btAdapter!!.isEnabled) {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          btAdapter!!.enable()
                      }
                  }

                  startIncomingListener()

                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_FOUND)
                      addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                  }
                  registerReceiver(receiver, filter)
              }

              private fun startDeviceScan() {
                  if (btAdapter == null) return
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Permission required!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  foundDevices.clear()
                  deviceNames.clear()
                  listAdapter.notifyDataSetChanged()

                  btAdapter?.bondedDevices?.let { paired ->
                      for (d in paired) {
                          foundDevices.add(d)
                          deviceNames.add("⭐ Paired: ${d.name}\n${d.address}")
                      }
                      listAdapter.notifyDataSetChanged()
                  }

                  if (btAdapter!!.isDiscovering) btAdapter!!.cancelDiscovery()
                  btAdapter!!.startDiscovery()
                  scanBtn.text = "Scanning..."
                  scanBtn.isEnabled = false
              }

              private fun startIncomingListener() {
                  acceptThread?.cancel()
                  acceptThread = AcceptThread()
                  acceptThread?.start()
              }

              private inner class AcceptThread : Thread() {
                  private var serverSocket: BluetoothServerSocket? = null
                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              serverSocket = btAdapter?.listenUsingRfcommWithServiceRecord(SERVICE_NAME, APP_UUID)
                          }
                      } catch (e: IOException) { e.printStackTrace() }
                  }

                  override fun run() {
                      var socket: BluetoothSocket?
                      while (true) {
                          try { socket = serverSocket?.accept() } catch (e: IOException) { break }
                          if (socket != null) {
                              val name = socket.remoteDevice?.name ?: "User"
                              runOnUiThread { showIncomingPopup(socket, name) }
                              break
                          }
                      }
                  }
                  fun cancel() { try { serverSocket?.close() } catch (e: Exception) {} }
              }

              private fun showIncomingPopup(socket: BluetoothSocket, caller: String) {
                  AlertDialog.Builder(this)
                      .setTitle("📞 Incoming Bluetooth Call")
                      .setMessage("$caller is calling you.")
                      .setCancelable(false)
                      .setPositiveButton("Accept") { _, _ ->
                          switchToInCallUI(caller)
                          initAudioStream(socket)
                      }
                      .setNegativeButton("Reject") { _, _ ->
                          try { socket.close() } catch (e: Exception) {}
                          startIncomingListener()
                      }
                      .show()
              }

              private fun connectToPeer(device: BluetoothDevice) {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) return
                  btAdapter?.cancelDiscovery()
                  connectThread?.cancel()
                  connectThread = ConnectThread(device)
                  connectThread?.start()
                  statusTv.text = "Connecting to ${device.name}..."
              }

              private inner class ConnectThread(private val device: BluetoothDevice) : Thread() {
                  private var socket: BluetoothSocket? = null
                  init {
                      try {
                          if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              socket = device.createRfcommSocketToServiceRecord(APP_UUID)
                          }
                      } catch (e: IOException) { e.printStackTrace() }
                  }

                  override fun run() {
                      try {
                          socket?.connect()
                          val name = device.name ?: "User"
                          runOnUiThread {
                              switchToInCallUI(name)
                          }
                          initAudioStream(socket!!)
                      } catch (e: IOException) {
                          e.printStackTrace()
                          try { socket?.close() } catch (e2: Exception) {}
                          runOnUiThread { statusTv.text = "Connection Failed!" }
                          startIncomingListener()
                      }
                  }
                  fun cancel() { try { socket?.close() } catch (e: Exception) {} }
              }

              private fun switchToInCallUI(name: String) {
                  connectedUserTv.text = name
                  mainDashboardLayout.visibility = View.GONE
                  inCallScreenLayout.visibility = View.VISIBLE
                  isCallRunning = true
              }

              private fun toggleMute() {
                  isMuted = !isMuted
                  muteBtn.text = if (isMuted) "🔇 Unmute" else "🎤 Mute"
                  muteBtn.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(if (isMuted) Color.parseColor("#EF4444") else Color.parseColor("#334155"))
                  }
                  Toast.makeText(this, if (isMuted) "Mic Muted" else "Mic Active", Toast.LENGTH_SHORT).show()
              }

              private fun toggleAudioRecording() {
                  isRecordingAudio = !isRecordingAudio
                  recordBtn.text = if (isRecordingAudio) "⏹️ Stop" else "⏺️ Record"
                  recordBtn.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(if (isRecordingAudio) Color.parseColor("#EF4444") else Color.parseColor("#334155"))
                  }
                  Toast.makeText(this, if (isRecordingAudio) "Audio Recording Started" else "Recording Saved", Toast.LENGTH_SHORT).show()
              }

              private fun initAudioStream(socket: BluetoothSocket) {
                  audioThread = AudioStreamThread(socket)
                  audioThread?.start()
              }

              private inner class AudioStreamThread(private val socket: BluetoothSocket) : Thread() {
                  private var input: InputStream? = null
                  private var output: OutputStream? = null

                  init {
                      try {
                          input = socket.inputStream
                          output = socket.outputStream
                      } catch (e: Exception) { e.printStackTrace() }
                  }

                  override fun run() {
                      val rate = 8000
                      val channelIn = AudioFormat.CHANNEL_IN_MONO
                      val channelOut = AudioFormat.CHANNEL_OUT_MONO
                      val format = AudioFormat.ENCODING_PCM_16BIT
                      val bufSize = AudioRecord.getMinBufferSize(rate, channelIn, format)

                      if (ActivityCompat.checkSelfPermission(this@MainActivity, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return

                      val recorder = AudioRecord(MediaRecorder.AudioSource.MIC, rate, channelIn, format, bufSize)
                      val track = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(format).setSampleRate(rate).setChannelMask(channelOut).build())
                          .setBufferSizeInBytes(bufSize)
                          .build()

                      recorder.startRecording()
                      track.play()

                      val sendBuffer = ByteArray(bufSize)
                      val recvBuffer = ByteArray(bufSize)

                      // Incoming Audio Stream
                      Thread {
                          try {
                              while (isCallRunning) {
                                  val bytes = input?.read(recvBuffer) ?: -1
                                  if (bytes > 0) {
                                      track.write(recvBuffer, 0, bytes)
                                  }
                              }
                          } catch (e: Exception) {}
                      }.start()

                      // Outgoing Audio Stream
                      try {
                          while (isCallRunning) {
                              val size = recorder.read(sendBuffer, 0, sendBuffer.size)
                              if (size > 0 && !isMuted) {
                                  output?.write(sendBuffer, 0, size)
                                  output?.flush()
                              }
                          }
                      } catch (e: Exception) {}
                      finally {
                          try {
                              recorder.stop()
                              recorder.release()
                              track.stop()
                              track.release()
                              socket.close()
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun terminateCall() {
                  isCallRunning = false
                  try {
                      acceptThread?.cancel()
                      connectThread?.cancel()
                  } catch (e: Exception) {}

                  inCallScreenLayout.visibility = View.GONE
                  mainDashboardLayout.visibility = View.VISIBLE
                  statusTv.text = "Status: Call Ended"
                  scanBtn.text = "🔍 Scan Nearby App Users"
                  scanBtn.isEnabled = true
                  Toast.makeText(this, "Call Disconnected", Toast.LENGTH_SHORT).show()
                  startIncomingListener()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(receiver) } catch (e: Exception) {}
                  terminateCall()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bluetooth-Call-App-v3
          path: app/build/outputs/apk/debug/app-debug.apk
