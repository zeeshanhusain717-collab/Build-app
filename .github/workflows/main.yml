name: Build Smooth Bluetooth Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create Structure & Gradle Files
        run: |
          mkdir -p app/src/main/java/com/bt/smartscanner
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartBTScanner"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.bt.smartscanner"
              compileSdk 34
              defaultConfig {
                  applicationId "com.bt.smartscanner"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Smart BT Scanner"
                  android:icon="@drawable/ic_launcher_bg"
                  android:roundIcon="@drawable/ic_launcher_bg"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3D Geometric Blue & White App Icon
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E3A8A" android:pathData="M0,0h108v108H0z"/>
              <path android:fillColor="#3B82F6" android:pathData="M0,54l54,54h54L54,0z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,24v30l-15,-15 -4,4 19,19 -19,19 4,4 15,-15v30l22,-22 -16,-16 16,-16z M58,34l10,10 -10,10z M58,74l10,-10 -10,-10z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Smart BT Scanner</string>
          </resources>
          EOF

      # MainActivity with Auto Bluetooth On/Off, Search Bar, and Local Memory Storage
      - name: Generate MainActivity
        run: |
          cat > app/src/main/java/com/bt/smartscanner/MainActivity.kt <<'EOF'
          package com.bt.smartscanner

          import android.Manifest
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private var bluetoothAdapter: BluetoothAdapter? = null
              private val deviceList = ArrayList<String>()
              private val deviceAddressMap = HashMap<String, String>()
              private lateinit var adapter: ArrayAdapter<String>
              private lateinit var listView: ListView
              private lateinit var searchEditText: EditText
              private lateinit var statusText: TextView
              private lateinit var sharedPreferences: SharedPreferences

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (BluetoothDevice.ACTION_FOUND == intent.action) {
                          val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                          if (device != null) {
                              if (ActivityCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                                  val name = device.name ?: "Unknown Device"
                                  val address = device.address
                                  val entry = "$name\n$address"
                                  if (!deviceAddressMap.containsKey(address)) {
                                      deviceAddressMap[address] = address
                                      deviceList.add(entry)
                                      adapter.notifyDataSetChanged()
                                      saveDeviceToMemory(name, address)
                                  }
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  sharedPreferences = getSharedPreferences("BT_Scanner_Prefs", Context.MODE_PRIVATE)
                  
                  requestPermissions()
                  initBluetooth()
                  enableBluetoothAutomatically()
                  setupUI()

                  val filter = IntentFilter(BluetoothDevice.ACTION_FOUND)
                  registerReceiver(receiver, filter)
                  loadSavedDevicesFromMemory()
              }

              private fun requestPermissions() {
                  val perms = arrayOf(
                      Manifest.permission.BLUETOOTH_SCAN,
                      Manifest.permission.BLUETOOTH_CONNECT,
                      Manifest.permission.BLUETOOTH_ADMIN,
                      Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  ActivityCompat.requestPermissions(this, perms, 501)
              }

              private fun initBluetooth() {
                  val manager = getSystemService(BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = manager.adapter
              }

              private fun enableBluetoothAutomatically() {
                  if (bluetoothAdapter != null) {
                      if (!bluetoothAdapter!!.isEnabled) {
                          if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                              val enableBtIntent = Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE)
                              startActivityForResult(enableBtIntent, 101)
                          }
                      }
                  }
              }

              private fun setupUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF0F172A.toInt())
                      setPadding(24, 32, 24, 32)
                  }

                  // Header Title
                  val title = TextView(this).apply {
                      text = "⚡ Smart Bluetooth Scanner"
                      textSize = 22f
                      setTextColor(0xFFFFD700.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 16)
                  }
                  root.addView(title)

                  // Search Bar & Scan Button
                  val topLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 0, 0, 16)
                  }

                  searchEditText = EditText(this).apply {
                      hint = "Search saved/nearby device..."
                      setHintTextColor(0xFF94A3B8.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setBackgroundColor(0xFF1E293B.toInt())
                      setPadding(20, 20, 20, 20)
                  }
                  val searchParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  topLayout.addView(searchEditText, searchParams)

                  val btnScan = Button(this).apply {
                      text = "SCAN"
                      setBackgroundColor(0xFF3B82F6.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { startScanning() }
                  }
                  val scanParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                      leftMargin = 16
                  }
                  topLayout.addView(btnScan, scanParams)

                  root.addView(topLayout)

                  statusText = TextView(this).apply {
                      text = "Bluetooth ready. Tap 'SCAN' to search."
                      textSize = 14f
                      setTextColor(0xFF94A3B8.toInt())
                      setPadding(0, 0, 0, 10)
                  }
                  root.addView(statusText)

                  // Device List
                  listView = ListView(this).apply {
                      setBackgroundColor(0xFF1E293B.toInt())
                  }
                  adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, deviceList)
                  listView.adapter = adapter

                  val listParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  root.addView(listView, listParams)

                  setContentView(root)

                  searchEditText.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before, count) {
                          adapter.filter.filter(s)
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })
              }

              private fun startScanning() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) return
                  
                  if (bluetoothAdapter?.isDiscovering == true) {
                      bluetoothAdapter?.cancelDiscovery()
                  }
                  bluetoothAdapter?.startDiscovery()
                  statusText.text = "Scanning nearby devices..."
                  Toast.makeText(this, "Scan started...", Toast.LENGTH_SHORT).show()
              }

              private fun saveDeviceToMemory(name: String, address: String) {
                  val editor = sharedPreferences.edit()
                  editor.putString(address, name)
                  editor.apply()
              }

              private fun loadSavedDevicesFromMemory() {
                  val allEntries = sharedPreferences.all
                  for ((address, name) in allEntries) {
                      val entry = "$name\n$address"
                      if (!deviceAddressMap.containsKey(address)) {
                          deviceAddressMap[address] = address
                          deviceList.add(entry)
                      }
                  }
                  adapter.notifyDataSetChanged()
              }

              override fun onStop() {
                  super.onStop()
                  // App close/cut hone par bluetooth disable karna
                  if (bluetoothAdapter != null && bluetoothAdapter!!.isEnabled) {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED) {
                          bluetoothAdapter?.disable()
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(receiver)
                  } catch (e: Exception) {}
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-BT-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk

